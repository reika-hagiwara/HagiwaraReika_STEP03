<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

    <!-- header -->
    <header>
        <h1>TNG CAFE</h1>
        <p>心安らぐ一杯をあなたに</p>
        <nav>
            <ul>
                <li><a href="#about">About Us</a></li>
                <li><a href="#menu">Menu</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- main -->
    <main>
        <!-- about section -->
        <section id="about">
            <h2>About Us</h2>
            <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>自家焙煎コーヒーと手作りスイーツで、穏やかな時間をお過ごしください。</p>
            <img src="images/cafe.jpg" alt="カフェの写真">
        </section>

        <!-- menu section -->
        <section id="menu">
            <h2>Menu</h2>
            <div>
                <img src="images/coffee.jpg" alt="コーヒー">
                <p>ブレンドコーヒー</p>
            </div>
            <div>
                <img src="images/cake.jpg" alt="ケーキ">
                <p>ベイクドチーズケーキ</p>
            </div>
            <div>
                <img src="images/latte.jpg" alt="ラテ">
                <p>カフェラテ</p>
            </div>
        </section>

        <!-- contact section -->
        <section id="contact">
            <h2>Contact</h2>
            <form action="#" method="post">
                <div>
                    <label for="name">お名前：</label>
                    <input type="text" id="name" name="name">
                </div>
                <div>
                    <label for="email">メールアドレス：</label>
                    <input type="email" id="email" name="email">
                </div>
                <div>
                    <label for="message">お問い合わせ内容：</label>
                    <textarea id="message" name="message"></textarea>
                </div>
                <button type="submit">送信</button>
            </form>
        </section>
    </main>

    <!-- footer -->
    <footer>
        <p>&copy; 2000 TNG Cafe</p>
    </footer>

</body>
</html>
